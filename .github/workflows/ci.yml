name: CI

on:
  pull_request:
  push:
    branches: [main, 'agent/**']

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test UstaEkosistemi.slnx
        working-directory: src/backend
      - run: dotnet list UstaEkosistemi.slnx package --vulnerable --include-transitive
        working-directory: src/backend

  pwa:
    name: PWA production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/usta-pwa/package-lock.json
      - run: npm ci
        working-directory: apps/usta-pwa
      - run: npm run build
        working-directory: apps/usta-pwa
      - run: npm audit --omit=dev --audit-level=high
        working-directory: apps/usta-pwa
